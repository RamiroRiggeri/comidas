<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planimorfi</title>
  <meta name="description" content="Planificador de comidas de la semana y lista del súper compartida.">
  <meta name="theme-color" content="#1E3B33">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,85,600..800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Tema elegido en este teléfono (claro/oscuro). Se aplica antes de pintar para que no parpadee.
    try {
      var t = localStorage.getItem('planimorfi.tema');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Pantalla de clave -->
  <main id="lock" class="lock" hidden>
    <img src="/icons/icon-192.png" alt="" width="72" height="72" class="lock-icon">
    <h1 class="lock-title">Planimorfi</h1>
    <p class="lock-text">Escribí la clave de la casa. Se pide una sola vez en este teléfono.</p>
    <form id="lock-form" class="lock-form" autocomplete="off">
      <label for="lock-input" class="visually-hidden">Clave de la casa</label>
      <div class="pass-field">
        <input id="lock-input" type="password" inputmode="text" placeholder="Clave de la casa" required autocapitalize="off" spellcheck="false">
        <button id="lock-eye" type="button" class="eye-btn" aria-label="Mostrar la clave" aria-pressed="false">
          <svg class="eye-open" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <svg class="eye-closed" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button type="submit" class="btn-primary">Entrar</button>
      <p id="lock-error" class="lock-error" role="alert"></p>
    </form>
  </main>

  <!-- App -->
  <div id="app" class="app" hidden>
    <header class="top">
      <div class="top-row">
        <h1 id="screen-title" class="screen-title">Lista del súper</h1>
        <div class="top-actions">
          <button id="install-btn" class="chip" type="button" hidden>Instalar</button>
          <button id="theme-btn" class="icon-btn" type="button" aria-label="Cambiar a modo oscuro">
            <svg class="ico-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/></svg>
            <svg class="ico-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
          </button>
          <button id="refresh-btn" class="icon-btn" type="button" aria-label="Actualizar">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div id="status-row" class="status-row">
        <span id="count"></span>
        <span id="synced" class="synced"></span>
      </div>
      <div id="week-nav" class="week-nav" hidden>
        <button id="week-prev" type="button" class="icon-btn" aria-label="Semana anterior">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="week-label">
          <span id="week-range"></span>
          <button id="week-today" type="button" class="link-btn" hidden>Volver a esta semana</button>
        </div>
        <button id="week-next" type="button" class="icon-btn" aria-label="Semana siguiente">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="tiles" aria-hidden="true"></div>
    </header>

    <!-- Lista -->
    <section id="view-lista" class="view">
      <ul id="todo" class="items" aria-label="Por comprar"></ul>
      <p id="empty" class="empty" hidden>La lista está vacía. Agregá lo que falta con el campo de abajo.</p>
      <div id="done-block" class="done-block" hidden>
        <h2 class="done-title">En el carrito</h2>
        <ul id="done" class="items items-done" aria-label="En el carrito"></ul>
        <button id="clear-btn" type="button" class="btn-quiet">Borrar tildados</button>
      </div>
      <div id="clear-all-block" class="clear-all-block" hidden>
        <button id="clear-all-btn" type="button" class="btn-quiet btn-muted">Borrar toda la lista</button>
      </div>
    </section>

    <!-- Placeholders de los próximos pasos -->
    <section id="view-semana" class="view" hidden>
      <div id="week" class="week"></div>
    </section>
    <section id="view-recetas" class="view" hidden>
      <p class="soon">Acá van a quedar las recetas con sus calorías. Llega después del planificador.</p>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <label for="composer-input" class="visually-hidden">Agregar a la lista</label>
      <input id="composer-input" type="text" placeholder="Ej: 2 kg tomate" enterkeyhint="done" autocapitalize="sentences">
      <button type="submit" class="add-btn" aria-label="Agregar">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </form>

    <nav class="tabs" aria-label="Secciones">
      <button class="tab" data-tab="semana" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Semana</span>
      </button>
      <button class="tab" data-tab="lista" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 6h1.5l2 10h10l2-7H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="19.5" r="1.4" fill="currentColor"/><circle cx="16.5" cy="19.5" r="1.4" fill="currentColor"/></svg>
        <span>Lista</span>
      </button>
      <button class="tab" data-tab="recetas" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 4h10a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2V4Zm0 14a2 2 0 0 1 2-2h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Recetas</span>
      </button>
    </nav>
  </div>

  <!-- Editar ítem -->
  <dialog id="edit" class="sheet">
    <form id="edit-form" method="dialog" class="sheet-form">
      <h2 class="sheet-title">Editar</h2>
      <label class="field">
        <span>Qué</span>
        <input id="edit-name" type="text" required maxlength="80" autocapitalize="sentences">
      </label>
      <label class="field">
        <span>Cantidad</span>
        <input id="edit-qty" type="text" maxlength="40" placeholder="Opcional">
      </label>
      <div class="sheet-actions">
        <button id="edit-delete" type="button" class="btn-danger">Borrar</button>
        <span class="spacer"></span>
        <button value="cancel" type="button" id="edit-cancel" class="btn-quiet">Cancelar</button>
        <button value="save" type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Cargar / editar comida -->
  <dialog id="meal" class="sheet">
    <form id="meal-form" method="dialog" class="sheet-form">
      <h2 id="meal-title" class="sheet-title"></h2>
      <label class="field">
        <span>Qué van a comer</span>
        <input id="meal-name" type="text" required maxlength="100" autocapitalize="sentences" placeholder="Ej: milanesas con puré">
      </label>
      <label class="field">
        <span>Notas</span>
        <input id="meal-notes" type="text" maxlength="300" placeholder="Opcional">
      </label>
      <div id="meal-move" class="field-row">
        <label class="field">
          <span>Día</span>
          <select id="meal-date"></select>
        </label>
        <label class="field">
          <span>Momento</span>
          <select id="meal-slot">
            <option value="almuerzo">Almuerzo</option>
            <option value="cena">Cena</option>
          </select>
        </label>
      </div>
      <p id="meal-swap-hint" class="hint" hidden></p>
      <div class="sheet-actions">
        <button id="meal-delete" type="button" class="btn-danger">Borrar</button>
        <span class="spacer"></span>
        <button id="meal-cancel" type="button" class="btn-quiet">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmar una acción que borra -->
  <dialog id="confirm" class="sheet">
    <form method="dialog" class="sheet-form">
      <h2 id="confirm-title" class="sheet-title"></h2>
      <p id="confirm-text" class="confirm-text"></p>
      <div class="sheet-actions">
        <span class="spacer"></span>
        <button value="cancel" class="btn-quiet">Cancelar</button>
        <button id="confirm-ok" value="ok" class="btn-destructive">Borrar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js" defer></script>
</body>
</html>
